<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="bg-title bg-desc">
  <title id="bg-title">Cocina de casa, luz fría</title>
  <desc id="bg-desc">Una cocina doméstica con armarios, nevera, encimera y una ventana pequeña. La luz azulada crea distancia.</desc>
  <defs>
    <linearGradient id="hk-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#69717a" />
      <stop offset="0.6" stop-color="#4b535d" />
      <stop offset="1" stop-color="#2b3139" />
    </linearGradient>
    <linearGradient id="hk-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f4744" />
      <stop offset="0.5" stop-color="#36302f" />
      <stop offset="1" stop-color="#1b1819" />
    </linearGradient>
    <linearGradient id="hk-window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16233b" />
      <stop offset="0.55" stop-color="#37506f" />
      <stop offset="1" stop-color="#8196ad" />
    </linearGradient>
    <radialGradient id="hk-vignette" cx="0.5" cy="0.48" r="0.74">
      <stop offset="0.5" stop-color="#05070d" stop-opacity="0" />
      <stop offset="1" stop-color="#05070d" stop-opacity="0.6" />
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#hk-wall)" />

  <!-- window -->
  <g>
    <rect x="1220" y="150" width="420" height="320" fill="url(#hk-window)" />
    <circle cx="1460" cy="260" r="36" fill="#e3edff" opacity="0.65" />
    <rect x="1220" y="150" width="420" height="320" fill="none" stroke="#2b323b" stroke-width="22" />
    <rect x="1424" y="150" width="12" height="320" fill="#2b323b" />
    <rect x="1220" y="304" width="420" height="12" fill="#2b323b" />
    <path d="M1190 470 H1670 V506 H1190 Z" fill="#2b323b" />
  </g>

  <!-- upper cabinets -->
  <g fill="#5a636f" stroke="#343b44" stroke-width="8">
    <rect x="100" y="150" width="280" height="230" rx="4" />
    <rect x="400" y="150" width="280" height="230" rx="4" />
    <rect x="700" y="150" width="280" height="230" rx="4" />
  </g>
  <g fill="#8d97a3">
    <rect x="220" y="250" width="10" height="52" rx="5" />
    <rect x="520" y="250" width="10" height="52" rx="5" />
    <rect x="820" y="250" width="10" height="52" rx="5" />
  </g>

  <!-- counter and appliances -->
  <g>
    <rect x="90" y="610" width="1080" height="34" rx="6" fill="#737b84" />
    <rect x="90" y="644" width="1080" height="240" fill="#4b5058" />
    <rect x="130" y="700" width="240" height="160" rx="4" fill="#5b626b" stroke="#393f47" stroke-width="6" />
    <circle cx="250" cy="780" r="36" fill="#2d333a" stroke="#808a95" stroke-width="5" />
    <rect x="440" y="690" width="190" height="170" rx="4" fill="#1e232a" stroke="#5b626b" stroke-width="6" />
    <rect x="470" y="720" width="130" height="90" rx="3" fill="#2f3a47" />
    <rect x="700" y="680" width="390" height="30" rx="4" fill="#8b929a" />
    <rect x="720" y="600" width="90" height="80" rx="6" fill="#2b3138" />
    <rect x="740" y="620" width="50" height="40" rx="4" fill="#53606d" />
    <rect x="840" y="620" width="130" height="10" rx="5" fill="#c4ccd6" opacity="0.4" />
  </g>

  <!-- fridge -->
  <g>
    <rect x="1360" y="420" width="310" height="560" rx="8" fill="#8d96a1" stroke="#4b545e" stroke-width="10" />
    <path d="M1360 600 H1670" stroke="#4b545e" stroke-width="8" />
    <rect x="1390" y="520" width="12" height="60" rx="6" fill="#3f4750" />
    <rect x="1390" y="650" width="12" height="120" rx="6" fill="#3f4750" />
    <rect x="1440" y="470" width="92" height="70" rx="3" fill="#d6dde4" opacity="0.55" transform="rotate(-3 1486 505)" />
  </g>

  <!-- table with two chairs -->
  <g>
    <rect x="470" y="790" width="470" height="28" rx="6" fill="#6b5749" />
    <rect x="510" y="818" width="22" height="180" fill="#4a3b32" />
    <rect x="880" y="818" width="22" height="180" fill="#4a3b32" />
    <path d="M260 820 Q330 780 400 820 L390 1010 H362 L352 880 H310 L300 1010 H272 Z" fill="#3b414a" />
    <path d="M1040 820 Q1110 780 1180 820 L1170 1010 H1142 L1132 880 H1090 L1080 1010 H1052 Z" fill="#3b414a" />
  </g>

  <path d="M0 680 H1920 V1080 H0 Z" fill="url(#hk-floor)" opacity="0.55" />
  <path d="M0 1040 H1920 V1080 H0 Z" fill="#0b0d12" />
  <rect width="1920" height="1080" fill="url(#hk-vignette)" />
</svg>
