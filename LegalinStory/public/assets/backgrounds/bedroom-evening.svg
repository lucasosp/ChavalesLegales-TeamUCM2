<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="bg-title bg-desc">
  <title id="bg-title">Sara's bedroom at dusk</title>
  <desc id="bg-desc">A teenager's bedroom with a desk, a bed, posters, and an evening window.</desc>
  <defs>
    <linearGradient id="bd-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3852" />
      <stop offset="0.6" stop-color="#33263c" />
      <stop offset="1" stop-color="#1e1727" />
    </linearGradient>
    <linearGradient id="bd-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2d55" />
      <stop offset="0.5" stop-color="#8a4c68" />
      <stop offset="0.75" stop-color="#e58972" />
      <stop offset="1" stop-color="#ffd39c" />
    </linearGradient>
    <linearGradient id="bd-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a33" />
      <stop offset="0.5" stop-color="#281c25" />
      <stop offset="1" stop-color="#130e16" />
    </linearGradient>
    <radialGradient id="bd-lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe7b8" stop-opacity="0.9" />
      <stop offset="0.5" stop-color="#ffc47a" stop-opacity="0.35" />
      <stop offset="1" stop-color="#ffb05e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bd-vignette" cx="0.5" cy="0.48" r="0.74">
      <stop offset="0.5" stop-color="#05030a" stop-opacity="0" />
      <stop offset="1" stop-color="#05030a" stop-opacity="0.6" />
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bd-wall)" />

  <!-- window -->
  <g>
    <rect x="1210" y="120" width="520" height="470" fill="url(#bd-sky)" />
    <circle cx="1510" cy="470" r="100" fill="#ffe5b5" opacity="0.9" />
    <path d="M1280 280 C1370 250 1440 268 1510 244 C1580 220 1650 234 1710 262" fill="none" stroke="#ffd6b2" stroke-width="14" stroke-linecap="round" opacity="0.2" />
    <rect x="1210" y="120" width="520" height="470" fill="none" stroke="#24182a" stroke-width="24" />
    <rect x="1458" y="120" width="16" height="470" fill="#24182a" />
    <rect x="1210" y="348" width="520" height="16" fill="#24182a" />
    <path d="M1180 600 H1760 V632 H1180 Z" fill="#24182a" />
  </g>

  <!-- desk -->
  <g>
    <rect x="130" y="700" width="720" height="34" rx="6" fill="#51383e" />
    <rect x="180" y="734" width="26" height="250" fill="#3a272e" />
    <rect x="770" y="734" width="26" height="250" fill="#3a272e" />
    <rect x="180" y="650" width="300" height="50" rx="4" fill="#2c1c25" />
    <rect x="200" y="612" width="220" height="40" rx="4" fill="#c7ae8d" opacity="0.55" />
  </g>

  <!-- phone and notebook on the desk -->
  <g>
    <rect x="560" y="664" width="70" height="132" rx="10" fill="#131018" stroke="#7d6677" stroke-width="3" transform="rotate(-8 595 730)" />
    <rect x="572" y="676" width="46" height="104" rx="5" fill="#d9c7b8" opacity="0.18" transform="rotate(-8 595 730)" />
    <circle cx="595" cy="785" r="4" fill="#8b7d8c" />
    <rect x="330" y="676" width="130" height="90" rx="3" fill="#e6d8c2" transform="rotate(4 395 721)" />
    <g stroke="#b7a48c" stroke-width="3" opacity="0.7">
      <path d="M350 700 H430" transform="rotate(4 395 721)" />
      <path d="M350 718 H444" transform="rotate(4 395 721)" />
      <path d="M350 736 H420" transform="rotate(4 395 721)" />
    </g>
  </g>

  <!-- bed -->
  <g>
    <rect x="70" y="820" width="680" height="190" rx="24" fill="#3c2a3a" />
    <rect x="70" y="790" width="680" height="80" rx="24" fill="#6b4c63" />
    <rect x="96" y="770" width="180" height="80" rx="22" fill="#a97c95" />
    <rect x="300" y="804" width="360" height="60" rx="18" fill="#8d627d" opacity="0.8" />
    <rect x="60" y="1000" width="700" height="28" fill="#231720" />
  </g>

  <!-- lamp and light pool -->
  <g>
    <path d="M1030 0 V180" stroke="#241820" stroke-width="5" />
    <path d="M970 220 Q1030 174 1090 220 L1060 256 H1000 Z" fill="#4a303c" />
    <ellipse cx="1030" cy="256" rx="30" ry="10" fill="#ffe0a8" />
    <path d="M900 256 L1160 256 L1240 820 L820 820 Z" fill="url(#bd-lamp)" opacity="0.22" />
  </g>

  <!-- posters -->
  <g>
    <rect x="980" y="160" width="160" height="220" rx="4" fill="#2a1c32" stroke="#6b4c63" stroke-width="6" transform="rotate(-3 1060 270)" />
    <circle cx="1060" cy="240" r="50" fill="#b06a78" opacity="0.55" transform="rotate(-3 1060 270)" />
    <path d="M1020 320 Q1060 280 1100 320" fill="none" stroke="#e9c7a1" stroke-width="6" transform="rotate(-3 1060 270)" />
    <rect x="180" y="180" width="220" height="160" rx="4" fill="#2a1c32" stroke="#6b4c63" stroke-width="6" />
    <path d="M220 300 L280 210 L340 300 Z" fill="#8d627d" opacity="0.5" />
  </g>

  <!-- floor -->
  <path d="M0 700 H1920 V1080 H0 Z" fill="url(#bd-floor)" opacity="0.55" />
  <path d="M0 1040 H1920 V1080 H0 Z" fill="#0f0a13" />

  <rect width="1920" height="1080" fill="url(#bd-vignette)" />
</svg>
