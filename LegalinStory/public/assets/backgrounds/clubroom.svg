<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="bg-title bg-desc">
  <title id="bg-title">Literature clubroom</title>
  <desc id="bg-desc">A warm clubroom with tall bookshelves, a window at sunset, and a reading table.</desc>
  <defs>
    <linearGradient id="bg-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c1b22" />
      <stop offset="0.7" stop-color="#1d1219" />
      <stop offset="1" stop-color="#120b11" />
    </linearGradient>
    <linearGradient id="bg-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a52" />
      <stop offset="0.45" stop-color="#94546b" />
      <stop offset="0.72" stop-color="#e88d70" />
      <stop offset="1" stop-color="#ffd9a0" />
    </linearGradient>
    <radialGradient id="bg-sun" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#fff4d2" />
      <stop offset="0.4" stop-color="#ffd79a" stop-opacity="0.9" />
      <stop offset="1" stop-color="#ff9f6d" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bg-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38232a" />
      <stop offset="0.4" stop-color="#21141b" />
      <stop offset="1" stop-color="#0c070d" />
    </linearGradient>
    <linearGradient id="bg-lamp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe6b8" stop-opacity="0.65" />
      <stop offset="1" stop-color="#ffb36e" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="bg-vignette" cx="0.5" cy="0.46" r="0.72">
      <stop offset="0.4" stop-color="#05030a" stop-opacity="0" />
      <stop offset="1" stop-color="#05030a" stop-opacity="0.4" />
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg-wall)" />

  <!-- window -->
  <g>
    <rect x="1170" y="110" width="600" height="540" fill="url(#bg-sky)" />
    <circle cx="1460" cy="540" r="190" fill="url(#bg-sun)" />
    <path d="M1240 320 C1330 290 1400 306 1470 280 C1540 254 1620 268 1690 300" fill="none" stroke="#ffd2ab" stroke-width="16" stroke-linecap="round" opacity="0.2" />
    <rect x="1170" y="110" width="600" height="540" fill="none" stroke="#1a1018" stroke-width="30" />
    <rect x="1462" y="110" width="22" height="540" fill="#1a1018" />
    <rect x="1170" y="366" width="600" height="22" fill="#1a1018" />
    <path d="M1140 650 H1800 V690 H1140 Z" fill="#1a1018" />
  </g>

  <!-- left bookshelf -->
  <g>
    <rect x="70" y="120" width="470" height="710" fill="#2a1a20" stroke="#150d12" stroke-width="10" />
    <g fill="#3b262c">
      <rect x="86" y="238" width="438" height="14" />
      <rect x="86" y="386" width="438" height="14" />
      <rect x="86" y="534" width="438" height="14" />
