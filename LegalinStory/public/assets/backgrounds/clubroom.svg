    <path d="M960 0 V164" stroke="#24151a" stroke-width="5" />
    <path d="M900 208 Q960 160 1020 208 L992 246 H928 Z" fill="#3a2229" />
    <ellipse cx="960" cy="246" rx="32" ry="10" fill="#ffdca6" />
