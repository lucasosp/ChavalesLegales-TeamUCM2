  </g>

  <!-- chairs -->
  <g fill="#160e13" opacity="0.92">
    <path d="M390 790 Q470 760 550 790 L540 960 H510 L500 850 H440 L430 960 H400 Z" />
    <path d="M1370 790 Q1450 760 1530 790 L1520 960 H1490 L1480 850 H1420 L1410 960 H1380 Z" />
  </g>

  <!-- shelves on the right wall, below the window -->
