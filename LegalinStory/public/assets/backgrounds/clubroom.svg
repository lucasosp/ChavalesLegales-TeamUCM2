  <!-- floor -->
  <path d="M0 710 H1920 V1080 H0 Z" fill="url(#bg-floor)" />
  <path d="M1120 710 H1740 L1880 1080 H980 Z" fill="#ffd8a1" opacity="0.12" />
  <path d="M0 710 H1920" stroke="#4b3038" stroke-width="3" opacity="0.5" />

