    <g>
      <rect x="104" y="306" width="24" height="80" fill="#4f5f6e" />
      <rect x="136" y="318" width="18" height="68" fill="#7b4a4c" />
      <rect x="162" y="300" width="28" height="86" fill="#6a4a5f" />
      <rect x="198" y="326" width="20" height="60" fill="#87654a" />
      <rect x="226" y="310" width="24" height="76" fill="#3f5b57" />
      <rect x="258" y="332" width="18" height="54" fill="#70434f" />
