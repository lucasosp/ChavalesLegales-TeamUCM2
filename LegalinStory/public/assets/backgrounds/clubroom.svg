  <!-- dust and light -->
  <g fill="#ffe3b4" opacity="0.4">
    <circle cx="1280" cy="420" r="3" />
    <circle cx="1360" cy="360" r="2" />
    <circle cx="1460" cy="460" r="3" />
    <circle cx="1540" cy="390" r="2" />
    <circle cx="1220" cy="540" r="2" />
    <circle cx="1420" cy="620" r="3" />
