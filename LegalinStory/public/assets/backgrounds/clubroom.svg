    <path d="M970 826 H1030" stroke="#b7a48c" stroke-width="3" opacity="0.7" />
    <path d="M970 838 H1030" stroke="#b7a48c" stroke-width="3" opacity="0.55" />
  </g>

  <!-- hanging lamp -->
