    <ellipse cx="960" cy="826" rx="410" ry="112" fill="#4b2e33" />
    <ellipse cx="960" cy="826" rx="350" ry="88" fill="#5b3a3d" opacity="0.55" />
    <rect x="640" y="842" width="30" height="160" fill="#2a181e" />
    <rect x="1250" y="842" width="30" height="160" fill="#2a181e" />
  </g>

  <!-- open book and lamp on the table -->
  <g>
    <path d="M850 812 Q900 796 950 812 L950 858 Q900 842 850 858 Z" fill="#e9ddc9" />
    <path d="M1050 812 Q1000 796 950 812 L950 858 Q1000 842 1050 858 Z" fill="#f4e9d6" />
