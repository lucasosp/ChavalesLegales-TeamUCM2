      <rect x="382" y="330" width="20" height="56" fill="#7a4a5b" />
      <rect x="410" y="304" width="24" height="82" fill="#62653f" />
      <rect x="442" y="322" width="18" height="64" fill="#8c5e47" />
      <rect x="468" y="312" width="30" height="74" fill="#4d3f63" />
    </g>
    <g>
      <rect x="104" y="454" width="20" height="80" fill="#7f5646" />
      <rect x="132" y="468" width="26" height="66" fill="#4a5f68" />
      <rect x="166" y="448" width="18" height="86" fill="#6f4254" />
      <rect x="192" y="474" width="24" height="60" fill="#8a6a49" />
      <rect x="224" y="458" width="28" height="76" fill="#415a55" />
      <rect x="260" y="480" width="18" height="54" fill="#744a5f" />
      <rect x="286" y="452" width="22" height="82" fill="#5b5375" />
