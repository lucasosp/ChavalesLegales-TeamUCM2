<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="bg-title bg-desc">
  <title id="bg-title">School guidance office</title>
  <desc id="bg-desc">A calm office with a desk, chairs, bookshelves, and daylight.</desc>
  <defs>
    <linearGradient id="of-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6dccb" />
      <stop offset="0.7" stop-color="#cdbfa9" />
      <stop offset="1" stop-color="#a99780" />
    </linearGradient>
    <linearGradient id="of-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8966d" />
      <stop offset="0.45" stop-color="#967552" />
      <stop offset="1" stop-color="#5e4632" />
    </linearGradient>
    <linearGradient id="of-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9d1e8" />
      <stop offset="1" stop-color="#eaf5ef" />
    </linearGradient>
    <radialGradient id="of-vignette" cx="0.5" cy="0.48" r="0.75">
      <stop offset="0.55" stop-color="#2a1c22" stop-opacity="0" />
      <stop offset="1" stop-color="#2a1c22" stop-opacity="0.25" />
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#of-wall)" />

  <!-- window -->
  <g>
    <rect x="1200" y="150" width="560" height="430" fill="url(#of-sky)" />
    <circle cx="1590" cy="350" r="60" fill="#fff6d4" opacity="0.7" />
    <rect x="1200" y="150" width="560" height="430" fill="none" stroke="#7d6b56" stroke-width="20" />
    <rect x="1470" y="150" width="16" height="430" fill="#7d6b56" />
    <rect x="1200" y="356" width="560" height="16" fill="#7d6b56" />
    <path d="M1170 600 H1780 V640 H1170 Z" fill="#7d6b56" />
  </g>

  <!-- bookshelf -->
  <g>
    <rect x="90" y="170" width="420" height="560" fill="#6b4f35" stroke="#4a3625" stroke-width="10" />
    <g fill="#8b6a4b">
      <rect x="104" y="270" width="392" height="12" />
      <rect x="104" y="400" width="392" height="12" />
      <rect x="104" y="530" width="392" height="12" />
      <rect x="104" y="660" width="392" height="12" />
    </g>
    <g>
      <rect x="124" y="196" width="24" height="70" fill="#8b4a44" />
      <rect x="154" y="206" width="18" height="60" fill="#4b5c6b" />
      <rect x="180" y="188" width="28" height="78" fill="#7d6a4b" />
      <rect x="216" y="212" width="20" height="54" fill="#5b3b5d" />
      <rect x="244" y="198" width="26" height="68" fill="#3e5f59" />
      <rect x="278" y="216" width="18" height="50" fill="#7a4b5e" />
      <rect x="304" y="190" width="30" height="76" fill="#4d476b" />
      <rect x="342" y="208" width="20" height="58" fill="#806044" />
      <rect x="370" y="196" width="24" height="70" fill="#5e3c3f" />
      <rect x="402" y="214" width="18" height="52" fill="#41606a" />
    </g>
    <g>
      <rect x="124" y="306" width="22" height="78" fill="#4f5f6e" />
      <rect x="152" y="320" width="18" height="64" fill="#7b4a4c" />
      <rect x="178" y="300" width="28" height="84" fill="#6a4a5f" />
      <rect x="214" y="326" width="20" height="58" fill="#87654a" />
      <rect x="242" y="310" width="24" height="74" fill="#3f5b57" />
      <rect x="274" y="330" width="18" height="54" fill="#70434f" />
      <rect x="300" y="302" width="30" height="82" fill="#554f75" />
      <rect x="338" y="322" width="18" height="62" fill="#8a5b50" />
      <rect x="364" y="308" width="26" height="76" fill="#465f63" />
      <rect x="398" y="328" width="20" height="56" fill="#7a4a5b" />
    </g>
    <g>
      <rect x="124" y="436" width="20" height="78" fill="#7f5646" />
      <rect x="152" y="450" width="26" height="64" fill="#4a5f68" />
      <rect x="186" y="432" width="18" height="82" fill="#6f4254" />
      <rect x="212" y="456" width="24" height="58" fill="#8a6a49" />
      <rect x="244" y="440" width="28" height="74" fill="#415a55" />
      <rect x="280" y="462" width="18" height="52" fill="#744a5f" />
      <rect x="306" y="434" width="22" height="80" fill="#5b5375" />
      <rect x="336" y="452" width="26" height="62" fill="#8b5a4f" />
      <rect x="370" y="438" width="18" height="76" fill="#4c6267" />
      <rect x="396" y="460" width="24" height="54" fill="#7c4b5c" />
    </g>
  </g>

  <!-- floor -->
  <path d="M0 720 H1920 V1080 H0 Z" fill="url(#of-floor)" />
  <path d="M0 720 H1920" stroke="#7d5f43" stroke-width="3" opacity="0.5" />

  <!-- desk -->
  <g>
    <rect x="560" y="760" width="860" height="34" rx="6" fill="#8b6a4b" />
    <rect x="600" y="794" width="28" height="230" fill="#6b4f35" />
    <rect x="1350" y="794" width="28" height="230" fill="#6b4f35" />
    <rect x="660" y="720" width="220" height="42" rx="4" fill="#e6d8c2" />
    <rect x="900" y="708" width="300" height="52" rx="4" fill="#2f3b5c" opacity="0.8" />
    <rect x="940" y="678" width="180" height="30" rx="3" fill="#f2eadc" opacity="0.7" />
  </g>

  <!-- chairs -->
  <g fill="#4b3746">
    <path d="M380 780 Q470 750 560 780 L550 980 H520 L510 850 H450 L440 980 H410 Z" />
    <path d="M1420 780 Q1510 750 1600 780 L1590 980 H1560 L1550 850 H1490 L1480 980 H1450 Z" />
  </g>

  <!-- plant -->
  <g>
    <path d="M250 1010 H370 L350 860 H270 Z" fill="#8b5a4f" />
    <path d="M310 860 C260 790 260 730 300 690" fill="none" stroke="#4b6a3e" stroke-width="10" stroke-linecap="round" />
    <path d="M310 860 C360 800 380 740 350 690" fill="none" stroke="#5f7d4a" stroke-width="10" stroke-linecap="round" />
    <ellipse cx="300" cy="690" rx="34" ry="60" fill="#5f7d4a" transform="rotate(-20 300 690)" />
    <ellipse cx="360" cy="700" rx="30" ry="56" fill="#4b6a3e" transform="rotate(18 360 700)" />
  </g>

  <!-- light pool -->
  <path d="M1200 640 L1760 640 L1860 1080 H1000 Z" fill="#fff0c4" opacity="0.18" />

  <rect width="1920" height="1080" fill="url(#of-vignette)" />
</svg>
