<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="bg-title bg-desc">
  <title id="bg-title">Classroom at dusk</title>
  <desc id="bg-desc">An empty classroom lit by a low orange sun through a tall window.</desc>
  <defs>
    <linearGradient id="bg-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241a30" />
      <stop offset="0.55" stop-color="#352237" />
      <stop offset="1" stop-color="#1b1221" />
    </linearGradient>
    <linearGradient id="bg-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2147" />
      <stop offset="0.34" stop-color="#69415c" />
      <stop offset="0.58" stop-color="#c97770" />
      <stop offset="0.76" stop-color="#f2a978" />
      <stop offset="1" stop-color="#ffe3b4" />
    </linearGradient>
    <radialGradient id="bg-sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d8" />
      <stop offset="0.35" stop-color="#ffe3a6" stop-opacity="0.95" />
      <stop offset="0.7" stop-color="#ffbd7f" stop-opacity="0.35" />
      <stop offset="1" stop-color="#ff9f6e" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bg-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24172a" />
      <stop offset="0.35" stop-color="#170f1c" />
      <stop offset="1" stop-color="#0b0710" />
    </linearGradient>
    <linearGradient id="bg-light" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffd39a" stop-opacity="0.5" />
      <stop offset="1" stop-color="#ff9f6e" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="bg-vignette" cx="0.48" cy="0.45" r="0.72">
      <stop offset="0.42" stop-color="#05030a" stop-opacity="0" />
      <stop offset="1" stop-color="#05030a" stop-opacity="0.4" />
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg-wall)" />

  <!-- window -->
  <g>
    <rect x="180" y="132" width="940" height="628" fill="url(#bg-sky)" />
    <circle cx="820" cy="566" r="230" fill="url(#bg-sun)" />
    <path d="M260 340 C380 310 470 330 560 300 C620 280 700 292 760 322" fill="none" stroke="#f7c9a5" stroke-width="18" stroke-linecap="round" opacity="0.22" />
    <path d="M430 430 C540 402 620 418 720 392" fill="none" stroke="#ffdcb2" stroke-width="12" stroke-linecap="round" opacity="0.18" />
    <rect x="180" y="132" width="940" height="628" fill="none" stroke="#1a101f" stroke-width="34" />
    <rect x="642" y="132" width="26" height="628" fill="#1a101f" />
    <rect x="180" y="428" width="940" height="26" fill="#1a101f" />
    <rect x="180" y="742" width="940" height="18" fill="#120b16" opacity="0.8" />
  </g>

  <!-- chalkboard -->
  <g>
    <rect x="1260" y="214" width="520" height="314" rx="6" fill="#18261f" stroke="#3b2a32" stroke-width="20" />
    <g stroke="#a5b9a3" stroke-linecap="round" opacity="0.22">
      <path d="M1300 282 H1450" stroke-width="7" />
      <path d="M1300 322 H1570" stroke-width="5" />
      <path d="M1300 358 H1510" stroke-width="5" />
      <path d="M1300 394 H1620" stroke-width="5" />
      <path d="M1300 430 H1470" stroke-width="4" />
    </g>
  </g>

  <!-- clock -->
  <g>
    <circle cx="1650" cy="146" r="38" fill="#1a111d" stroke="#4b3441" stroke-width="7" />
    <path d="M1650 146 V124" stroke="#d9b9a0" stroke-width="5" stroke-linecap="round" />
    <path d="M1650 146 L1668 154" stroke="#d9b9a0" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- floor -->
  <path d="M0 700 H1920 V1080 H0 Z" fill="url(#bg-floor)" />
  <path d="M300 700 L790 700 L1130 1080 L170 1080 Z" fill="url(#bg-light)" opacity="0.28" />
  <path d="M0 700 H1920" stroke="#3a2738" stroke-width="3" opacity="0.55" />

  <!-- desks -->
  <g fill="#140e19">
    <path d="M190 806 H560 L588 858 H166 Z" />
    <path d="M690 796 H1060 L1088 848 H666 Z" />
    <path d="M1190 786 H1560 L1588 838 H1166 Z" />
    <path d="M300 944 H650 L674 984 H278 Z" opacity="0.9" />
    <path d="M800 934 H1150 L1174 974 H778 Z" opacity="0.9" />
    <path d="M1300 924 H1650 L1674 964 H1278 Z" opacity="0.9" />
  </g>
  <g fill="#0d0912" opacity="0.95">
    <path d="M250 858 H340 V1020 H250 Z" />
    <path d="M740 848 H830 V1010 H740 Z" />
    <path d="M1240 838 H1330 V1000 H1240 Z" />
    <path d="M430 984 H500 V1080 H430 Z" />
    <path d="M930 974 H1000 V1080 H930 Z" />
    <path d="M1430 964 H1500 V1080 H1430 Z" />
  </g>

  <!-- floating dust in the light -->
  <g fill="#ffe0b0" opacity="0.34">
    <circle cx="520" cy="560" r="3" />
    <circle cx="610" cy="500" r="2" />
    <circle cx="710" cy="620" r="3" />
    <circle cx="430" cy="680" r="2" />
    <circle cx="840" cy="470" r="2" />
    <circle cx="910" cy="650" r="3" />
  </g>

  <rect width="1920" height="1080" fill="url(#bg-vignette)" />
</svg>
