<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="bg-title bg-desc">
  <title id="bg-title">Quiet interview room</title>
  <desc id="bg-desc">A small, calm room with a table, two chairs, and a window.</desc>
  <defs>
    <linearGradient id="qr-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe4dc" />
      <stop offset="0.7" stop-color="#c3ccc0" />
      <stop offset="1" stop-color="#a6b0a3" />
    </linearGradient>
    <linearGradient id="qr-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b7a184" />
      <stop offset="0.5" stop-color="#95816a" />
      <stop offset="1" stop-color="#5f5142" />
    </linearGradient>
    <linearGradient id="qr-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8d8e8" />
      <stop offset="1" stop-color="#edf3e8" />
    </linearGradient>
    <radialGradient id="qr-vignette" cx="0.5" cy="0.48" r="0.74">
      <stop offset="0.55" stop-color="#243026" stop-opacity="0" />
      <stop offset="1" stop-color="#243026" stop-opacity="0.24" />
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#qr-wall)" />

  <!-- window -->
  <g>
    <rect x="1180" y="180" width="520" height="380" fill="url(#qr-sky)" />
    <rect x="1180" y="180" width="520" height="380" fill="none" stroke="#7a8a7b" stroke-width="18" />
    <rect x="1432" y="180" width="16" height="380" fill="#7a8a7b" />
    <rect x="1180" y="360" width="520" height="16" fill="#7a8a7b" />
    <path d="M1150 560 H1740 V594 H1150 Z" fill="#7a8a7b" />
  </g>

  <!-- wall art -->
  <g>
    <rect x="230" y="200" width="300" height="220" rx="4" fill="#eef0e8" stroke="#8a9787" stroke-width="8" />
    <path d="M270 370 L350 280 L430 370 Z" fill="#8fa98f" opacity="0.55" />
    <circle cx="440" cy="260" r="26" fill="#d9b77d" opacity="0.6" />
  </g>

  <!-- floor -->
  <path d="M0 720 H1920 V1080 H0 Z" fill="url(#qr-floor)" />
  <path d="M0 720 H1920" stroke="#7d6b56" stroke-width="3" opacity="0.45" />

  <!-- table -->
  <g>
    <rect x="640" y="760" width="640" height="30" rx="8" fill="#8b6a4b" />
    <rect x="700" y="790" width="26" height="220" fill="#6b4f35" />
    <rect x="1190" y="790" width="26" height="220" fill="#6b4f35" />
    <rect x="820" y="706" width="130" height="54" rx="4" fill="#f2eadc" />
    <rect x="980" y="718" width="150" height="42" rx="4" fill="#d8e2d8" />
    <ellipse cx="960" cy="742" rx="22" ry="8" fill="#8fa98f" opacity="0.5" />
  </g>

  <!-- chairs -->
  <g fill="#4b5a4e">
    <path d="M430 780 Q520 748 610 780 L600 990 H570 L560 852 H490 L480 990 H450 Z" />
    <path d="M1310 780 Q1400 748 1490 780 L1480 990 H1450 L1440 852 H1370 L1360 990 H1330 Z" />
  </g>

  <!-- plant -->
  <g>
    <path d="M160 1010 H270 L252 860 H178 Z" fill="#8b5a4f" />
    <path d="M210 860 C170 800 174 748 208 710" fill="none" stroke="#5f7d4a" stroke-width="9" stroke-linecap="round" />
    <path d="M220 860 C260 808 274 758 250 716" fill="none" stroke="#4b6a3e" stroke-width="9" stroke-linecap="round" />
    <ellipse cx="208" cy="710" rx="30" ry="54" fill="#5f7d4a" transform="rotate(-18 208 710)" />
    <ellipse cx="252" cy="720" rx="26" ry="50" fill="#4b6a3e" transform="rotate(16 252 720)" />
  </g>

  <!-- soft light -->
  <path d="M1180 560 L1700 560 L1820 1080 H1030 Z" fill="#fff4cf" opacity="0.2" />
  <ellipse cx="960" cy="1030" rx="420" ry="60" fill="#2b3a2c" opacity="0.16" />

  <rect width="1920" height="1080" fill="url(#qr-vignette)" />
</svg>
