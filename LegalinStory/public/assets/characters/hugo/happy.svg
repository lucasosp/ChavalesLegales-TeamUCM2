  <style>
    .sp-sprite {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: hugo-breathe 7s ease-in-out infinite;
    }
    .sp-eyelids rect {
      transform-box: fill-box;
      transform-origin: center;
      animation: hugo-blink 6.5s infinite;
    }
    @keyframes hugo-breathe {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-2px) scale(1.006); }
    }
    @keyframes hugo-blink {
      0%, 95.4%, 100% { transform: scaleY(0); }
      96.2%, 97.6% { transform: scaleY(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .sp-sprite, .sp-eyelids rect { animation: none; }
    }
  </style>

  <title id="hugo-title">Hugo — happy</title>
  <desc id="hugo-desc">Hugo, a character in Chavales Legales.</desc>

