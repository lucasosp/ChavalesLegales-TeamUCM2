<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="840"
  height="1240"
  viewBox="0 0 420 620"
  role="img"
  aria-labelledby="padre-title padre-desc"
  data-character="padre"
