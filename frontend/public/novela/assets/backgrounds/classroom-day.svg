<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="bg-title bg-desc">
  <title id="bg-title">Classroom in the morning</title>
  <desc id="bg-desc">A bright classroom with desks, a chalkboard, and large windows.</desc>
  <defs>
    <linearGradient id="cd-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6dfd0" />
      <stop offset="1" stop-color="#c8bdab" />
    </linearGradient>
    <linearGradient id="cd-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9ae87" />
      <stop offset="0.5" stop-color="#a88862" />
      <stop offset="1" stop-color="#6f5438" />
    </linearGradient>
    <linearGradient id="cd-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cc9e8" />
      <stop offset="0.55" stop-color="#cfe9f4" />
      <stop offset="1" stop-color="#fff1d0" />
    </linearGradient>
    <radialGradient id="cd-sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8dd" />
      <stop offset="0.45" stop-color="#ffe3ac" stop-opacity="0.75" />
      <stop offset="1" stop-color="#ffd18b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cd-light" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#fff2ca" stop-opacity="0.55" />
      <stop offset="1" stop-color="#ffe0a0" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="cd-vignette" cx="0.5" cy="0.48" r="0.75">
      <stop offset="0.58" stop-color="#2a1c22" stop-opacity="0" />
      <stop offset="1" stop-color="#2a1c22" stop-opacity="0.26" />
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#cd-wall)" />

  <!-- windows -->
  <g>
    <rect x="140" y="130" width="820" height="520" fill="url(#cd-sky)" />
    <circle cx="690" cy="430" r="170" fill="url(#cd-sun)" />
    <path d="M210 280 C310 250 390 268 470 242 C550 218 630 232 700 260" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" opacity="0.28" />
    <rect x="140" y="130" width="820" height="520" fill="none" stroke="#7d6b56" stroke-width="26" />
    <rect x="538" y="130" width="20" height="520" fill="#7d6b56" />
    <rect x="140" y="382" width="820" height="20" fill="#7d6b56" />
  </g>

  <!-- chalkboard -->
  <g>
    <rect x="1170" y="196" width="610" height="340" rx="4" fill="#34534a" stroke="#7d6b56" stroke-width="20" />
    <g stroke="#dce8d8" stroke-linecap="round" opacity="0.35">
      <path d="M1210 270 H1390" stroke-width="6" />
      <path d="M1210 312 H1540" stroke-width="5" />
      <path d="M1210 350 H1490" stroke-width="5" />
      <path d="M1210 388 H1600" stroke-width="5" />
      <path d="M1210 426 H1430" stroke-width="4" />
    </g>
  </g>

  <!-- clock and notice board -->
  <g>
    <circle cx="1690" cy="118" r="34" fill="#f2eadc" stroke="#7d6b56" stroke-width="6" />
    <path d="M1690 118 V100" stroke="#5f4a3e" stroke-width="4" stroke-linecap="round" />
    <path d="M1690 118 L1706 126" stroke="#5f4a3e" stroke-width="3" stroke-linecap="round" />
  </g>
  <rect x="1200" y="640" width="360" height="190" rx="4" fill="#d8c7a8" stroke="#8b7558" stroke-width="10" />
  <g fill="#f6eedf">
    <rect x="1225" y="665" width="90" height="70" />
    <rect x="1330" y="665" width="110" height="70" />
    <rect x="1455" y="665" width="80" height="70" />
    <rect x="1225" y="748" width="140" height="60" />
    <rect x="1380" y="748" width="155" height="60" />
  </g>

  <!-- floor -->
  <path d="M0 710 H1920 V1080 H0 Z" fill="url(#cd-floor)" />
  <path d="M0 710 H1920" stroke="#8b6a4b" stroke-width="3" opacity="0.55" />
  <path d="M360 710 L860 710 L1180 1080 L160 1080 Z" fill="url(#cd-light)" opacity="0.36" />

  <!-- desks -->
  <g fill="#8b6a4b">
    <path d="M180 810 H560 L590 860 H150 Z" />
    <path d="M700 800 H1080 L1110 850 H670 Z" />
    <path d="M1220 790 H1600 L1630 840 H1190 Z" />
    <path d="M280 950 H640 L668 992 H252 Z" opacity="0.9" />
    <path d="M800 940 H1160 L1188 982 H772 Z" opacity="0.9" />
    <path d="M1320 930 H1680 L1708 972 H1292 Z" opacity="0.9" />
  </g>
  <g fill="#6b4f35">
    <path d="M220 860 H350 V1030 H220 Z" />
    <path d="M740 850 H870 V1020 H740 Z" />
    <path d="M1260 840 H1390 V1010 H1260 Z" />
    <path d="M410 992 H500 V1080 H410 Z" />
    <path d="M940 982 H1030 V1080 H940 Z" />
    <path d="M1460 972 H1550 V1080 H1460 Z" />
  </g>
  <g fill="#f4ead8" opacity="0.8">
    <rect x="250" y="790" width="70" height="10" rx="3" />
    <rect x="770" y="780" width="70" height="10" rx="3" />
    <rect x="1290" y="770" width="70" height="10" rx="3" />
  </g>

  <rect width="1920" height="1080" fill="url(#cd-vignette)" />
</svg>
