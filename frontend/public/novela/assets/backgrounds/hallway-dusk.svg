<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="bg-title bg-desc">
  <title id="bg-title">Hallway at dusk</title>
  <desc id="bg-desc">A long school hallway narrowing toward a warm window at the far end.</desc>
  <defs>
    <linearGradient id="bg-ceiling" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0912" />
      <stop offset="1" stop-color="#251a2b" />
    </linearGradient>
    <linearGradient id="bg-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1b2a" />
      <stop offset="0.5" stop-color="#180f1c" />
      <stop offset="1" stop-color="#08050c" />
    </linearGradient>
    <linearGradient id="bg-left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#171020" />
      <stop offset="1" stop-color="#2a1c30" />
    </linearGradient>
    <linearGradient id="bg-right" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#100b17" />
      <stop offset="1" stop-color="#24182a" />
    </linearGradient>
    <radialGradient id="bg-endglow" cx="0.5" cy="0.52" r="0.5">
      <stop offset="0" stop-color="#fff2cd" />
      <stop offset="0.32" stop-color="#ffdda2" />
      <stop offset="0.68" stop-color="#f7a06f" stop-opacity="0.55" />
      <stop offset="1" stop-color="#e88763" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bg-lightpool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe0ac" stop-opacity="0.38" />
      <stop offset="1" stop-color="#ff9d6e" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="bg-vignette" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0.4" stop-color="#05030a" stop-opacity="0" />
      <stop offset="1" stop-color="#05030a" stop-opacity="0.4" />
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="#0a0710" />

  <!-- perspective shell -->
  <path d="M0 0 L960 506 L1920 0 Z" fill="url(#bg-ceiling)" />
  <path d="M0 0 L960 506 L0 1080 Z" fill="url(#bg-left)" />
  <path d="M1920 0 L960 506 L1920 1080 Z" fill="url(#bg-right)" />
  <path d="M0 1080 L960 506 L1920 1080 Z" fill="url(#bg-floor)" />

  <!-- distant window -->
  <g>
    <rect x="838" y="360" width="244" height="300" fill="#2a1a24" stroke="#0c0811" stroke-width="10" />
    <rect x="854" y="376" width="212" height="268" fill="#ffdfa8" />
    <circle cx="998" cy="500" r="66" fill="#fff6dc" />
    <rect x="957" y="376" width="10" height="268" fill="#392431" opacity="0.9" />
    <rect x="854" y="500" width="212" height="10" fill="#392431" opacity="0.9" />
    <circle cx="960" cy="510" r="260" fill="url(#bg-endglow)" opacity="0.9" />
  </g>

  <!-- left doors -->
  <g fill="#211728" stroke="#0b0810" stroke-width="5">
    <path d="M70 292 L250 352 L250 780 L70 916 Z" />
    <path d="M338 392 L468 432 L468 704 L338 760 Z" />
  </g>
  <g fill="#3b2839" opacity="0.55">
    <rect x="118" y="390" width="72" height="34" rx="3" />
    <rect x="366" y="462" width="52" height="24" rx="3" />
  </g>

  <!-- right lockers -->
  <g fill="#1c1323" stroke="#0a0710" stroke-width="4">
    <path d="M1670 292 L1850 292 L1850 916 L1670 780 Z" />
    <path d="M1640 352 L1670 352 L1670 760 L1640 700 Z" />
  </g>
  <g stroke="#35233a" stroke-width="3" opacity="0.55">
    <path d="M1694 330 V860" />
    <path d="M1732 320 V892" />
    <path d="M1770 310 V912" />
    <path d="M1808 300 V930" />
  </g>
  <g fill="#c9a07d" opacity="0.35">
    <rect x="1720" y="520" width="8" height="34" rx="4" />
    <rect x="1796" y="512" width="8" height="34" rx="4" />
  </g>

  <!-- floor seams -->
  <g stroke="#3b283c" stroke-width="2" opacity="0.35">
    <path d="M0 1080 L960 506" />
    <path d="M1920 1080 L960 506" />
    <path d="M330 1080 L760 506" />
    <path d="M1590 1080 L1160 506" />
    <path d="M720 1080 L900 506" />
    <path d="M1200 1080 L1020 506" />
  </g>

  <!-- ceiling lights -->
  <g fill="#ffe1ae" opacity="0.55">
    <rect x="900" y="118" width="120" height="12" rx="6" />
    <rect x="918" y="238" width="84" height="9" rx="4" opacity="0.6" />
    <rect x="934" y="334" width="52" height="7" rx="3" opacity="0.45" />
  </g>

  <!-- light pooling on the floor -->
  <path d="M770 1080 L1150 1080 L1040 566 L880 566 Z" fill="url(#bg-lightpool)" opacity="0.55" />
  <ellipse cx="960" cy="790" rx="300" ry="90" fill="#ffd49e" opacity="0.05" />

  <rect width="1920" height="1080" fill="url(#bg-vignette)" />
</svg>
