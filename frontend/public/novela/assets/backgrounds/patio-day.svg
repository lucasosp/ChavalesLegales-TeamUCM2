<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="bg-title bg-desc">
  <title id="bg-title">School courtyard</title>
  <desc id="bg-desc">A sunny school courtyard with benches, trees, and the main building.</desc>
  <defs>
    <linearGradient id="pd-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7db8df" />
      <stop offset="0.55" stop-color="#bfe0ef" />
      <stop offset="1" stop-color="#eaf6ef" />
    </linearGradient>
    <linearGradient id="pd-building" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dccfba" />
      <stop offset="1" stop-color="#b5a48c" />
    </linearGradient>
    <linearGradient id="pd-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9a888" />
      <stop offset="0.35" stop-color="#98a276" />
      <stop offset="1" stop-color="#5e6b46" />
    </linearGradient>
    <linearGradient id="pd-tree" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fa05f" />
      <stop offset="1" stop-color="#4b6a3e" />
    </linearGradient>
    <radialGradient id="pd-vignette" cx="0.5" cy="0.46" r="0.75">
      <stop offset="0.55" stop-color="#20301f" stop-opacity="0" />
      <stop offset="1" stop-color="#20301f" stop-opacity="0.3" />
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#pd-sky)" />

  <!-- building -->
  <rect x="0" y="260" width="1920" height="470" fill="url(#pd-building)" />
  <rect x="0" y="240" width="1920" height="40" fill="#8f7e68" />
  <g fill="#a8d0e6" stroke="#8f7e68" stroke-width="10">
    <rect x="160" y="340" width="150" height="130" />
    <rect x="380" y="340" width="150" height="130" />
    <rect x="600" y="340" width="150" height="130" />
    <rect x="820" y="340" width="150" height="130" />
    <rect x="1040" y="340" width="150" height="130" />
    <rect x="1260" y="340" width="150" height="130" />
    <rect x="1480" y="340" width="150" height="130" />
    <rect x="1700" y="340" width="150" height="130" />
    <rect x="160" y="520" width="150" height="130" />
    <rect x="380" y="520" width="150" height="130" />
    <rect x="600" y="520" width="150" height="130" />
    <rect x="820" y="520" width="150" height="130" />
    <rect x="1040" y="520" width="150" height="130" />
    <rect x="1260" y="520" width="150" height="130" />
    <rect x="1480" y="520" width="150" height="130" />
    <rect x="1700" y="520" width="150" height="130" />
  </g>
  <g fill="#7d6c58">
    <rect x="900" y="620" width="120" height="110" />
    <rect x="880" y="600" width="160" height="24" />
  </g>

  <!-- ground -->
  <path d="M0 720 H1920 V1080 H0 Z" fill="url(#pd-ground)" />
  <path d="M0 720 H1920" stroke="#7c8a5c" stroke-width="4" opacity="0.6" />
  <path d="M120 760 L1800 760 L1920 1080 H0 Z" fill="#c8b998" opacity="0.3" />

  <!-- trees -->
  <g>
    <rect x="120" y="420" width="34" height="330" fill="#6b4f35" />
    <circle cx="137" cy="380" r="150" fill="url(#pd-tree)" />
    <circle cx="70" cy="450" r="110" fill="url(#pd-tree)" />
    <circle cx="210" cy="460" r="115" fill="url(#pd-tree)" />

    <rect x="1740" y="400" width="38" height="350" fill="#6b4f35" />
    <circle cx="1760" cy="350" r="160" fill="url(#pd-tree)" />
    <circle cx="1680" cy="440" r="115" fill="url(#pd-tree)" />
    <circle cx="1850" cy="450" r="105" fill="url(#pd-tree)" />
  </g>

  <!-- benches -->
  <g fill="#7b5c3d" stroke="#56402b" stroke-width="5">
    <rect x="430" y="800" width="340" height="26" rx="8" />
    <rect x="430" y="862" width="340" height="22" rx="8" />
    <rect x="460" y="826" width="18" height="80" />
    <rect x="720" y="826" width="18" height="80" />
    <rect x="1160" y="800" width="340" height="26" rx="8" />
    <rect x="1160" y="862" width="340" height="22" rx="8" />
    <rect x="1190" y="826" width="18" height="80" />
    <rect x="1450" y="826" width="18" height="80" />
  </g>

  <!-- path and shadows -->
  <path d="M0 980 L520 760 L1400 760 L1920 980" fill="#d8c9a8" opacity="0.22" />
  <g fill="#2d3a25" opacity="0.28">
    <ellipse cx="480" cy="930" rx="210" ry="34" />
    <ellipse cx="1210" cy="930" rx="210" ry="34" />
  </g>
  <g fill="#fff4c9" opacity="0.55">
    <circle cx="640" cy="260" r="26" />
    <circle cx="980" cy="220" r="20" />
    <circle cx="1330" cy="250" r="24" />
  </g>

  <rect width="1920" height="1080" fill="url(#pd-vignette)" />
</svg>
