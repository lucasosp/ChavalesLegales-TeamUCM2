name: Despliegue Automático en Servidor FDI UCM

on:
  # El despliegue automático por SSH desde GitHub Actions no funciona
  # porque el firewall de la UCM bloquea el puerto 22 desde IPs externas.
  # Usar deploy-server.bat desde la red de la facultad (eduroam/cable/VPN).
  workflow_dispatch:

jobs:
  deploy:
    name: Despliegue en Producción
    runs-on: ubuntu-latest

    steps:
      - name: Comprobar configuración de credenciales
        run: |
          echo "=== Verificación de credenciales SSH ==="
          if [ -n "${{ secrets.SERVER_PASSWORD || secrets.PASSWORD || secrets.SSH_PASSWORD || secrets.DATATHON_PASSWORD || vars.SERVER_PASSWORD || vars.PASSWORD }}" ] || [ -n "${{ secrets.SERVER_KEY || secrets.SSH_KEY || secrets.KEY || vars.SERVER_KEY || vars.SSH_KEY }}" ]; then
            echo " Credencial SSH detectada correctamente."
          else
            echo " ERROR: No se ha detectado ninguna contrasena o clave SSH en los secretos del repositorio."
            echo "Por favor, crea el secreto 'SERVER_PASSWORD' en GitHub: Settings > Secrets and variables > Actions > Repository secrets."
          fi

      - name: Ejecutar despliegue vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST || secrets.HOST || vars.SERVER_HOST || 'chavaleslegales.fdi.ucm.es' }}
          username: ${{ secrets.SERVER_USER || secrets.USERNAME || vars.SERVER_USER || 'datathon' }}
          password: ${{ secrets.SERVER_PASSWORD || secrets.PASSWORD || secrets.SSH_PASSWORD || secrets.DATATHON_PASSWORD || vars.SERVER_PASSWORD || vars.PASSWORD }}
          key: ${{ secrets.SERVER_KEY || secrets.SSH_KEY || secrets.KEY || vars.SERVER_KEY || vars.SSH_KEY }}
          passphrase: ${{ secrets.PASSPHRASE || vars.PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT || secrets.PORT || vars.SERVER_PORT || 22 }}
          script: |
            echo "Iniciando despliegue en /var/www/chavaleslegales..."
            cd /var/www/chavaleslegales
            
            # Conectar al nuevo repositorio TeamUCM2
            git remote set-url origin https://github.com/lucasosp/ChavalesLegales-TeamUCM2.git || true
            
            # Actualizar código limpio desde el nuevo repositorio
            git fetch origin main
            git reset --hard origin/main
            
            # Actualizar dependencias y compilar frontend
            cd /var/www/chavaleslegales/frontend
            npm install
            npm run build
            
            # Actualizar dependencias de backend
            cd /var/www/chavaleslegales/backend
            if [ ! -d "venv" ]; then python3 -m venv venv; fi
            source venv/bin/activate
            pip install -r requirements.txt
            deactivate
            
            # Reiniciar servicios con PM2
            cd /var/www/chavaleslegales
            pm2 restart ecosystem.config.js || pm2 start ecosystem.config.js
            pm2 save
            
            echo "Despliegue completado con éxito."

