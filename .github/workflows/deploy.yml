name: Despliegue Automático en Servidor FDI UCM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Despliegue en Producción
    runs-on: ubuntu-latest

    steps:
      - name: Disparar despliegue vía Webhook HTTPS
        run: |
          echo "Disparando despliegue en https://chavaleslegales.fdi.ucm.es/api/deploy..."
          STATUS=$(curl -k -s -o response.txt -w "%{http_code}" -X POST https://chavaleslegales.fdi.ucm.es/api/deploy \
            -H "X-Deploy-Token: chavales-secret-deploy-token-2026")
          
          echo "Código HTTP de respuesta: $STATUS"
          cat response.txt || true
          echo ""

          if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 202 ]; then
            echo "Despliegue disparado con éxito en el servidor."
          else
            echo "Aviso/Error: El servidor respondió con código $STATUS"
            exit 1
          fi
